# Copy to secrets.yaml and chmod 600. Never commit secrets.yaml.
#
#   cp secrets.example.yaml secrets.yaml && chmod 600 secrets.yaml
#
# The password is URL-encoded automatically when the RTSP and CGI URLs are
# built, so put it here verbatim -- no %3D escaping by hand.

camera:
  password: "change-me"

# Shared password for the wall panel and the media browser. The club wifi is
# not a trust boundary.
web:
  password: "change-me-too"

# Pre-shared key for the radio link. The same value must be set at the far
# end. Generate one with:  ./link_cli.py genkey
link:
  psk: "change-me-as-well"

# Push notifications. The topic IS the secret on a public ntfy server --
# anyone who knows it can read every alert and see the stills. Make it long
# and random and never put it in config.yaml:
#
#     openssl rand -hex 16
#
# token is only needed for a server that requires auth (an ntfy.sh account, or
# your own with access control). Leave it out otherwise.
notify:
  topic: "replace-me-with-something-random"
  # token: "tk_..."
